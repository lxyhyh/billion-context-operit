name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bump patch version
        # CI 每次运行（push/PR）即代表有代码改动：递增 patch 版本号并同步
        # manifest.json 与 src/packages/bili_manager.js 的 PACKAGE_VERSION。
        # 仅用于本次构建产物，不写回仓库。
        run: |
          node -e "
            const fs = require('fs');
            const manifestPath = 'manifest.json';
            const managerPath = 'src/packages/bili_manager.js';
            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            const parts = String(manifest.version).split('.').map(Number);
            while (parts.length < 3) parts.push(0);
            parts[2] = (parts[2] || 0) + 1;
            const next = parts.join('.');
            console.log('版本号: ' + manifest.version + ' -> ' + next);
            manifest.version = next;
            fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');
            const src = fs.readFileSync(managerPath, 'utf8');
            const replaced = src.replace(/(var PACKAGE_VERSION = \")[^\"]*(\";)/, '\$1' + next + '\$2');
            if (replaced === src) {
              console.error('PACKAGE_VERSION 同步失败: 未找到 var PACKAGE_VERSION = \"...\";');
              process.exit(1);
            }
            fs.writeFileSync(managerPath, replaced);
            console.log('已同步 PACKAGE_VERSION = ' + next);
          "

      - name: Syntax check
        run: |
          node --check src/main.js
          node --check src/packages/bili_manager.js
          node --check src/ui/bili_console/index.ui.js
          node --check src/ui/bili_config/index.ui.js

      - name: Manifest validation
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8')); console.log('manifest OK')"

      - name: Tool consistency check
        run: |
          node -e "
            const src = require('fs').readFileSync('src/packages/bili_manager.js','utf8');
            const meta = JSON.parse(src.match(/\/\* METADATA\s*([\s\S]*?)\*\//)[1]);
            const toolNames = meta.tools.map(t => t.name);
            const exportsNames = src.match(/^exports\.(\w+)/gm).map(l => l.split('.')[1].split('=')[0].trim());
            const missing = toolNames.filter(n => !exportsNames.includes(n));
            const extra = exportsNames.filter(n => !toolNames.includes(n));
            if (missing.length || extra.length) {
              console.error('工具注册不一致! missing=' + missing + ' extra=' + extra);
              process.exit(1);
            }
            console.log('✓ 工具注册一致性 OK (' + toolNames.length + '/' + exportsNames.length + ')');
          "

      - name: Package
        run: |
          VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('manifest.json','utf8')).version)")
          PKG_ID=$(node -e "console.log(JSON.parse(require('fs').readFileSync('manifest.json','utf8')).toolpkg_id)")
          mkdir -p dist
          zip -rq "dist/${PKG_ID}-v${VERSION}.toolpkg" manifest.json src

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: toolpkg
          path: dist/*.toolpkg
